<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="밍카">
  <!-- 밍카 브랜드 컬러를 사용한 단순한 M 아이콘입니다. -->
  <rect width="64" height="64" rx="16" fill="#7567e8"/>
  <!-- 작은 화면에서도 식별되도록 밍카의 첫 글자를 크게 표시합니다. -->
  <text x="32" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="900" fill="#ffffff">M</text>
</svg>